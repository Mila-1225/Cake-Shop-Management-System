{% extends "admin_base.html" %}
{% block content %}

<h2>Products</h2>

<a href="{{ url_for('admin_add_product') }}" class="btn btn-dark mb-3">+ Add Product</a>
<a href="{{ url_for('admin_add_themed_product') }}" class="btn btn-warning mb-3">
  + Add Themed Cake
</a>
<a href="{{ url_for('admin_add_item') }}" class="btn btn-success">
        🍪 Add Bakery Item
    </a>
<table class="table table-bordered table-striped bg-white">
    <thead class="table-dark">
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price (₹)</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for p in products %}
        <tr>
            <td><img src="{{ p.image_url }}" width="80" class="rounded"></td>
            <td>{{ p.product_name }}</td>
            <td>{{ p.product_price }}</td>

            <td>
                <a href="{{ url_for('admin_product_preview', pid=p.product_id) }}" class="btn btn-info btn-sm">Preview</a>

                <a href="{{ url_for('admin_edit_product', pid=p.product_id) }}" class="btn btn-warning btn-sm">Edit</a>

                <form action="{{ url_for('admin_delete_product', pid=p.product_id) }}" method="POST" style="display:inline;">
                    <button class="btn btn-danger btn-sm" onclick="return confirm('Delete this product?')">Delete</button>
                </form>
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
