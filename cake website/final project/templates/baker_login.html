<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baker Login - Parose Patisserie</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
        --maroon:#6b1717;
        --deep-gold:#d4af37;
    }

    body {
        font-family: Inter, Arial, sans-serif;
        background: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .logo-top {
        position: absolute;
        top: 20px;
        left: 30px;
        height: 70px;
        filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
    }

    .login-center {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        min-height: 80vh;
    }

    .login-card {
        width: 100%;
        max-width: 450px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        margin-top: 50px;
    }

    h3 {
        color: var(--maroon);
        font-weight: 900;
        margin-bottom: 25px;
        text-align: center;
    }

    .btn-primary {
        background-color: var(--deep-gold);
        border-color: var(--deep-gold);
        color: #000;
        font-weight: 700;
        padding: 10px;
        width: 100%;
    }

    .btn-primary:hover {
        background-color: #b8941f;
        border-color: #b8941f;
    }

    .form-control:focus {
        border-color: var(--deep-gold);
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
    }
  </style>
</head>

<body>

<!-- Logo in top left -->
<a href="/">
    <img src="/static/logo.png" class="logo-top" alt="Parose Patisserie">
</a>

<!-- Centered Login Form -->
<div class="login-center">
    <div class="login-card">
        <h3>Baker Login</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary">Login</button>
        </form>
    </div>
</div>

</body>
</html>
