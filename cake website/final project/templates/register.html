{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:500px">
  <h3>Register</h3>
  <form method="post">
    <div class="mb-2"><label>Username</label><input name="username" class="form-control" required></div>
    <div class="mb-2"><label>Password</label><input name="password" type="password" class="form-control" required></div>
    <div class="mb-2"><label>Email</label><input name="email" class="form-control"></div>
    <div class="mb-2"><label>Address</label><input name="address" class="form-control"></div>
    <div class="mb-2"><label>Phone</label><input name="phone" class="form-control"></div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
</div>
{% endblock %}
