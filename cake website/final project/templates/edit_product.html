{% extends "admin_base.html" %}
{% block content %}

<h2>Edit Product</h2>

<form method="POST" enctype="multipart/form-data" class="card p-4">

    <label>Name:</label>
    <input type="text" name="product_name" class="form-control" value="{{ product.product_name }}" required>

    <label class="mt-3">Price:</label>
    <input type="text" name="product_price" class="form-control" value="{{ product.product_price }}" required>

    <label class="mt-3">Description:</label>
    <textarea name="description" class="form-control">{{ product.description }}</textarea>

    <label class="mt-3">Current Image:</label><br>
    <img src="{{ product.image_url }}" width="120" class="rounded mb-3">

    <input type="file" name="file" class="form-control">

    <button class="btn btn-warning mt-4">Save Changes</button>

</form>

{% endblock %}
