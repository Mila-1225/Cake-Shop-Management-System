<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Profile - Parose Patisserie</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
        --maroon:#6b1717;
        --deep-gold:#d4af37;
    }

    body {
        font-family: Inter, Arial, sans-serif;
        background: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .logo-top {
        position: absolute;
        top: 20px;
        left: 30px;
        height: 70px;
        filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
    }

    .profile-center {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        min-height: 80vh;
        padding-top: 50px;
    }

    .profile-form {
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h3 {
        color: var(--maroon);
        font-weight: 900;
        margin-bottom: 25px;
        text-align: center;
    }

    .btn-primary {
        background-color: var(--deep-gold);
        border-color: var(--deep-gold);
        color: #000;
        font-weight: 700;
        padding: 10px;
        width: 100%;
        margin-top: 15px;
    }

    .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
        color: white;
        font-weight: 700;
        padding: 10px;
        width: 100%;
        margin-top: 10px;
    }

    .btn-primary:hover {
        background-color: #b8941f;
        border-color: #b8941f;
    }

    .form-control:focus {
        border-color: var(--deep-gold);
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
    }

    .form-label {
        font-weight: 600;
        color: var(--maroon);
        margin-top: 10px;
    }

    .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
    }

    .input-group {
        position: relative;
    }

    .input-group-text {
        background-color: #f8f9fa;
        border: 1px solid #ced4da;
    }
  </style>
</head>

<body>

<!-- Logo in top left -->
<a href="/">
    <img src="/static/logo.png" class="logo-top" alt="Parose Patisserie">
</a>

<!-- Centered Edit Profile Form -->
<div class="profile-center">
    <div class="profile-form">
        <h3>Edit Profile</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ 'success' if cat=='success' else 'warning' }} alert-dismissible fade show" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" onsubmit="return validatePhone()">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ user.username }}" readonly disabled style="background-color: #f8f9fa;">
                <div class="help-text">Username cannot be changed</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address *</label>
                <textarea name="address" class="form-control" rows="3" required>{{ user.address }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number *</label>
                <div class="input-group">
                    <span class="input-group-text">+91</span>
                    <input type="tel"
                           name="phone"
                           id="phoneInput"
                           class="form-control"
                           value="{{ user.phone }}"
                           maxlength="10"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);"
                           placeholder="10-digit mobile number"
                           required>
                </div>
                <div class="help-text" id="phoneHelp">Must be exactly 10 digits</div>
                <div class="help-text text-danger" id="phoneError" style="display: none;"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Save Changes</button>
            <a href="{{ url_for('profile') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script>
function validatePhone() {
    const phoneInput = document.getElementById('phoneInput');
    const phoneError = document.getElementById('phoneError');
    const phoneValue = phoneInput.value.trim();

    // Reset
    phoneError.style.display = 'none';
    phoneInput.classList.remove('is-invalid');

    // Check if exactly 10 digits
    if (phoneValue.length !== 10) {
        phoneError.textContent = 'Phone number must be exactly 10 digits';
        phoneError.style.display = 'block';
        phoneInput.classList.add('is-invalid');
        return false;
    }

    // Check if all digits are numbers
    if (!/^\d+$/.test(phoneValue)) {
        phoneError.textContent = 'Phone number can only contain digits';
        phoneError.style.display = 'block';
        phoneInput.classList.add('is-invalid');
        return false;
    }

    return true;
}

// Prevent typing non-numeric characters
document.getElementById('phoneInput').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);

    // Update help text color based on length
    const phoneHelp = document.getElementById('phoneHelp');
    if (this.value.length === 10) {
        phoneHelp.classList.remove('text-danger');
        phoneHelp.classList.add('text-success');
        phoneHelp.textContent = '✓ Valid phone number';
    } else {
        phoneHelp.classList.remove('text-success');
        phoneHelp.classList.add('text-danger');
        phoneHelp.textContent = `${10 - this.value.length} digits remaining`;
    }
});

// Form validation on submit
document.querySelector('form').addEventListener('submit', function(e) {
    if (!validatePhone()) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
