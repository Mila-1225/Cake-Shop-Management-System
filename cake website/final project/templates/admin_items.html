{% extends "base.html" %}
{% block title %}Bakery Items{% endblock %}
{% block content %}

<h2 style="color:var(--maroon)">Bakery Items</h2>

<a href="{{ url_for('admin_add_item') }}" class="btn btn-success mb-3">+ Add New Item</a>

<div class="d-flex flex-wrap gap-3">

{% for item in items %}
  <div class="card p-2" style="width:250px;">
    <img src="{{ item.image_url }}" style="width:100%; height:160px; object-fit:cover; border-radius:6px">

    <h5 class="mt-2">{{ item.item_name }}</h5>
    <div class="fw-bold">₹{{ item.item_price }}</div>

    <div class="d-flex justify-content-between mt-2">
      <a href="{{ url_for('admin_edit_item', item_id=item.item_id) }}" class="btn btn-warning btn-sm">Edit</a>

      <form method="post" action="{{ url_for('admin_delete_item', item_id=item.item_id) }}">
        <button onclick="return confirm('Delete item?')" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </div>
  </div>
{% endfor %}

</div>

{% endblock %}
